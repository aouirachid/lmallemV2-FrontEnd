<div class="p-3 mb-2 bg-primary bg-gradient text-white">
    <div class="row">
        <div class="col-sm-5 col-md-6 fw-bold">Client List</div>
        <div class="col-sm-5 offset-sm-2 col-md-6 offset-md-0 text-end">
            <a class="nav-link btn text-end fw-bold" routerLink="/add-client"><i class="fa fa-plus"></i> New Client</a>
        </div>
    </div>
</div>

<div class="container mt-4">
    <table datatable [dtOptions]="dtOptions" [dtTrigger]="dttrigger" class="table table-hover">
        <thead>
            <tr>
                <th scope="col">Id</th>
                <th scope="col">Name</th>
                <th scope="col">Phone</th>
                <th scope="col">City</th>
                <th scope="col">Denomination</th>
                <th scope="col">Rc</th>
                <th scope="col">ICE</th>
                <th scope="col">Status</th>
                <th scope="col">Action</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let Client of Clients; let i = index">
                <td>{{ Client.id }}</td>
                <td>{{ Client.user.name }}</td>
                <td>{{ Client.user.phone }}</td>
                <td>{{ Client.user.city }}</td>
                <td>{{ Client.denomination }}</td>
                <td>{{ Client.rc}}</td>
                <td>{{ Client.ice}}</td>
                <td *ngIf="Client.status == '1';else inactive"><span class="badge text-bg-success">Active</span></td>
                <ng-template #inactive>
                    <td><span class="badge text-bg-danger">Inactive</span></td>
                </ng-template>
                <td>
                    <button type="button" class="btn btn-danger" (click)="delete(Client.id, i)" ><i class="fa fa-trash"></i></button>
                    <button type="button" class="btn btn-success mx-2" [routerLink]="['/edit-client', Client.id]"><i class="fa fa-edit"></i></button>
                </td>
        </tbody>
    </table>    
</div>
